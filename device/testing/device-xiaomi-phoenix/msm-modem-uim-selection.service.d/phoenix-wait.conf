[Unit]
After=ModemManager.service

[Service]
# Wait until the modem shows up in MM before selecting the SIM session;
# at plain boot this unit otherwise runs before qrtr/rmtfs are ready.
ExecStartPre=/bin/sh -c "i=0; while [ $i -lt 30 ]; do mmcli -L 2>/dev/null | grep -q Modem && break; sleep 2; i=\$((i+1)); done"
