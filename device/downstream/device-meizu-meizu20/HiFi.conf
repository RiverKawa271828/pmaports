# m2381 audio: WCD9385 (headphones/headset/mic, RX/TX macros) +
# Cirrus CS35L45 x2 on Secondary MI2S (SPK = loudspeaker, RCV = earpiece).
# The mainline cs35l45 driver loads no DSP firmware (no speaker
# protection). Digital/Analog PCM values are RAW control units (the
# current controls are 0..457 with a dB TLV - the old dB-domain values
# like -104 decoded to raw ~7 = inaudible). Numbers = the T4c-proven
# operating point, user ear-judged 2026-10-04 (audio-resume-b evidence):
#   SPK Digital 251 (~55%), RCV Digital 183 (40%), SPK Analog 3,
#   RCV Analog 1 (receiver rating < loudspeaker).
# 89% on RCV trips its short-error overload protection - do not raise.
# Desktop volume keys work as pulseaudio SOFTWARE volume: no
# PlaybackVolume is declared on purpose, so the slider can never push
# the amps past this operating point.

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Built-in loudspeaker (CS35L45)"

	EnableSequence [
		cset "name='SPK DACPCM Source' ASP_RX1"
		cset "name='SPK Digital PCM Volume' 251"
		cset "name='SPK Analog PCM Volume' 3"
		cset "name='SPK AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='SPK AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece receiver (CS35L45)"

	EnableSequence [
		cset "name='RCV DACPCM Source' ASP_RX1"
		cset "name='RCV Digital PCM Volume' 183"
		cset "name='RCV Analog PCM Volume' 1"
		cset "name='RCV AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='RCV AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

# r26: the Headphones/Mic/Headset sections are REMOVED, not dormant:
# their PCMs are the WCD9385 FE/BE paths (hw:0,1 = MultiMedia2,
# hw:0,2 = MultiMedia3) whose backend DAIs do not exist in our DTS
# (no WCD dai-links). pulseaudio probes the highest-priority device
# first (Headphones, 300), the open fails ("no backend DAIs enabled")
# and the WHOLE card is dropped ("Failed to find a working profile").
# Re-add them only together with WCD dai-links in the DTS.

# SectionDevice."Headphones" ... removed r26
