# m2381 audio: Cirrus CS35L45 x2 on Secondary MI2S (SPK 1-0031 = bottom
# loudspeaker, RCV 1-0030 = top unit).  WCD9385 (headphones/mic) is not
# brought up; see the removed-sections note at the bottom.
#
# r42 (2026-10-06 audio round): DIRECT DRIVE restored (full verdict in
# the r41 meizu-audio-route.sh header): the through-DSP path
# (DACPCM=DSP_TX1) pays a full wmfw+bin re-download on every stream
# start (cs_dsp_power_down drops the image) = multi-second starts, plus
# PLL-unlock / global-error storms while the DSP ran = the noise/snow
# domain. User ear verdict on the direct-drive sine test: "非常干净".
# The csets below now pin the direct-drive route and the T4c-era
# proven-safe registers so UCM profile switches can no longer
# resurrect the DSP path or the full-gain point (r41 route script
# pins the same values at boot; these run on every profile enable).
#   Speaker  = stereo pair: SPK ASP_RX2 (slot1/R) 409/3,
#              RCV ASP_RX1 (slot0/L) 251/1
#   Earpiece = @30 alone, 251/1
# Direct-drive stereo pending user ear confirmation (sine alternation
# heard as separated).
# Desktop volume = pulseaudio SOFTWARE volume on top of this point.
#
# UCM devices:
#   Speaker  = the stereo pair (bottom loud, top gentle)
#   Earpiece = @30 alone at the same gentle levels

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Stereo pair: bottom loudspeaker (loud) + top unit (gentle)"

	EnableSequence [
		cset "name='RCV DACPCM Source' 1"
		cset "name='SPK DACPCM Source' 2"
		cset "name='SPK Digital PCM Volume' 409"
		cset "name='RCV Digital PCM Volume' 251"
		cset "name='SPK Analog PCM Volume' 3"
		cset "name='RCV Analog PCM Volume' 1"
		cset "name='SPK AMP Enable Switch' 1"
		cset "name='RCV AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='SPK AMP Enable Switch' 0"
		cset "name='RCV AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Top unit alone (desktop port switch)"

	EnableSequence [
		cset "name='RCV DACPCM Source' 1"
		cset "name='RCV Digital PCM Volume' 251"
		cset "name='RCV Analog PCM Volume' 1"
		cset "name='RCV AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='RCV AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

