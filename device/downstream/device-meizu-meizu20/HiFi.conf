# m2381 audio: WCD9385 (headphones/headset/mic, RX/TX macros) +
# Cirrus CS35L45 x2 on Secondary MI2S (SPK = loudspeaker, RCV = earpiece).
# The mainline cs35l45 driver loads no DSP firmware (no speaker
# protection), so volumes stay at the Flyme operating point translated
# into the mainline control domain:
#   stock "Digital PCM Volume" 817 == mainline -104 == -26 dB
#   stock "AMP PCM Gain" 19 dB     == mainline "Analog PCM Volume" 3
# RCV gets an extra -12.5 dB (receiver rating < loudspeaker).  Raise
# only live with ears on the device.

SectionVerb {
	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Built-in loudspeaker (CS35L45)"

	EnableSequence [
		cset "name='SPK DACPCM Source' ASP_RX1"
		cset "name='SPK Digital PCM Volume' -104"
		cset "name='SPK Analog PCM Volume' 3"
		cset "name='SPK AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='SPK AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece receiver (CS35L45)"

	EnableSequence [
		cset "name='RCV DACPCM Source' ASP_RX1"
		cset "name='RCV Digital PCM Volume' -154"
		cset "name='RCV Analog PCM Volume' 3"
		cset "name='RCV AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='RCV AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"

	Include.wcdmic1e.File "/codecs/wcd938x/AnalogMic1EnableSeq.conf"
	Include.wcdmic1d.File "/codecs/wcd938x/AnalogMic1DisableSeq.conf"
	Include.txmic1e.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmic1d.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	Include.wcdhsmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdhsmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txhsmice.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txhsmicd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
		JackHWMute "Mic"
	}
}
