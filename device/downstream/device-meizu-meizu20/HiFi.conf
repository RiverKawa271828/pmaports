# m2381 audio: Cirrus CS35L45 x2 on Secondary MI2S (SPK 1-0031 = bottom
# loudspeaker, RCV 1-0030 = top unit).  WCD9385 (headphones/mic) is not
# brought up; see the removed-sections note at the bottom.
#
# r30-r32 (2026-10-04 evening): stock-aligned SIGNAL PATH + registers.
# Stock/flyme runs BOTH amps through the on-chip DSP ("spk_prot" path:
# DSP1 Enable=1, Digital 817 == raw 409) - the CS35L45 SpeakerProtect
# firmware limits in real time from IV sense; that is why flyme can
# hold full registers without tripping the amp short-error protection
# (our bypass-path 409 test DID trip it on @30; through-DSP 409 does
# not, and the user reports less noise). r32 therefore routes
# DACPCM Source = DSP_TX1 (enum index 3) on both amps.
#   SPK (@31, bottom)  Digital 409 (0 dBFS) / Analog 3 (19 dBV) = stock
#   RCV (@30, top)     Digital 183 / Analog 1 - PROVISIONAL: @30 runs
#       the SPK-tuned limiter until per-amp firmware lands (mainline
#       builds one firmware name for both amps; stock harvest has
#       cs35l45-spk-* AND cs35l45-rcv-* sets = kernel fork item).
# Stereo slots: ASPRX1=slot0/ASPRX2=slot1 are chip defaults; the R
# channel has NOT been observed at @30 (mono copp suspect, BE channel
# investigation pending) - the Desktop port switch (Earpiece) works
# regardless.
# Desktop volume = pulseaudio SOFTWARE volume on top of this point
# (flyme's media-volume equivalence).
#
# UCM devices:
#   Speaker  = the stereo pair (bottom loud, top gentle for now)
#   Earpiece = @30 alone at the same gentle levels

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Stereo pair: bottom loudspeaker (loud) + top unit (gentle)"

	EnableSequence [
		cset "name='SPK DACPCM Source' 3"
		cset "name='RCV DACPCM Source' 3"
		cset "name='SPK Digital PCM Volume' 409"
		cset "name='RCV Digital PCM Volume' 183"
		cset "name='SPK Analog PCM Volume' 3"
		cset "name='RCV Analog PCM Volume' 1"
		cset "name='SPK AMP Enable Switch' 1"
		cset "name='RCV AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='SPK AMP Enable Switch' 0"
		cset "name='RCV AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Top unit alone (desktop port switch)"

	EnableSequence [
		cset "name='RCV DACPCM Source' 3"
		cset "name='RCV Digital PCM Volume' 183"
		cset "name='RCV Analog PCM Volume' 1"
		cset "name='RCV AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='RCV AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

# r26: the Headphones/Mic/Headset sections are REMOVED, not dormant:
# their PCMs are the WCD9385 FE/BE paths (hw:0,1 = MultiMedia2,
# hw:0,2 = MultiMedia3) whose backend DAIs do not exist in our DTS
# (no WCD dai-links). pulseaudio probes the highest-priority device
# first (Headphones, 300), the open fails ("no backend DAIs enabled")
# and the WHOLE card is dropped ("Failed to find a working profile").
# Re-add them only together with WCD dai-links in the DTS.

# SectionDevice."Headphones" ... removed r26
# SectionDevice."Mic" ... removed r26
# SectionDevice."Headset" ... removed r26
