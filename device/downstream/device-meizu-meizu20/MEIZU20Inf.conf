Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8550/HiFi.conf"
	Comment "HiFi playback"
}

BootSequence [
	cset "name='SPK AMP Enable Switch' 0"
	cset "name='RCV AMP Enable Switch' 0"
	cset "name='SPK DACPCM Source' ASP_RX1"
	cset "name='RCV DACPCM Source' ASP_RX1"
	cset "name='SPK Digital PCM Volume' -104"
	cset "name='RCV Digital PCM Volume' -154"
	cset "name='SPK Analog PCM Volume' 3"
	cset "name='RCV Analog PCM Volume' 3"
	cset "name='RX_RX0 Digital Volume' 84"
	cset "name='RX_RX1 Digital Volume' 84"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='RX_COMP1 Switch' 0"
	cset "name='RX_COMP2 Switch' 0"
]

LibraryConfig.remap.Config {
	ctl.default.map {
		"name='HP Volume'" {
			"name='HPHL Volume'".vindex.0 0
			"name='HPHR Volume'".vindex.1 0
		}
	}
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
