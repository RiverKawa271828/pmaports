# Meizu 20 (device pkg r59): load uinput at boot. Steam Input probes
# /dev/uinput at startup; misc devices have no open-time autoload, so
# without this the node only exists as a dead static node until someone
# runs modprobe by hand.
uinput
# uhid (r80 CONFIG_UHID=m): bluez opens /dev/uhid when accepting a BLE
# HOG connection — same no-autoload gap, and bluetoothd just drops the
# connection ("input-hog profile accept failed") when the node is absent.
# Load it unconditionally so BLE keyboards/mice/gamepads work on first boot.
uhid
