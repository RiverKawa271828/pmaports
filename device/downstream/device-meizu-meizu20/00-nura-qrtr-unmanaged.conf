[keyfile]
# r75: qmapmux*（MM qcom-soc mux 子接口）进 unmanaged——NM 不认 qmapmux0.0，
# addr/route/DNS 归 mm-dial.sh 自理；结构性隔离防 NM 半接管（NM×qmapmux 集成挂候补）。
# r78: qrtr0 摘出 unmanaged——plasma-nm 的 CellularModem（快速设置"移动数据"
# 开关 + kcm_cellular_network）要求 NM 里存在与 MM modem 对应的 ModemDevice，
# qrtr0 unmanaged ⇒ m_nmModem=null ⇒ 开关死/APN 列表建不起来（11-25 用户报）。
# qrtr0 现在 managed 但 gsm profile 均 autoconnect=false ⇒ NM 不会开机自动拨号
# （防"NM auto-enable = 循环加速器"复发）；boot 数据面仍归 mm-dial/keeper。
unmanaged-devices=interface-name:rmnet_ipa0,interface-name:rmnet0,interface-name:qmapmux*
