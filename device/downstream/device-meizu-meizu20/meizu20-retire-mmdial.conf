# Meizu 20 (m2381) tmpfiles: mm-dial.service boot 退役清扫（r80，2026-11-25）。
# P3 蜂窝标准化：数据面交还 NM 标准形态（P2 全通 + ★单 call 域 = NM 与 mm-dial
# 互斥不可并存）；profile autoconnect=true 接管 boot 拨号。unit 保留 ship（手工
# 救援 + cell-switch 显式 restart 仍可用）。preset 只作用新装机，旧装机的 /etc
# enable 符号链接不属包管理 —— 不清则 boot 仍拉起 mm-dial 与 NM 打架（照
# meizu20-retire-pas / meizu20-retire-dataup 先例）。
R /etc/systemd/system/multi-user.target.wants/mm-dial.service
