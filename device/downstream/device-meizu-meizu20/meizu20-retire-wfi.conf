# Meizu 20 (m2381) tmpfiles: meizu-wfi.service 退役清扫（r86，2026-11-27）。
# 深睡线解锁轮（一百二十六）判词：开机禁三簇深 cpuidle = 屏灭功耗真凶（0.9-1.1W）；
# 解禁实证屏灭 0.58W 档（中位 0.555W）+ s2idle 30/60/120/300/600/600s = 7/7 全净
# （freeze+EBUSY 零复现，wowlan 开 = 日用形态）。服务文件随包退场；机上 mask 符号
# 链接（/etc/systemd/system/meizu-wfi.service -> /dev/null，126 轮 disable+mask
# 落机件）不属包管理 —— 不清则包摘除后悬空 mask 永驻（R 行对不存在路径静默跳过，
# 新装机 no-op）。恢复门 = 回装旧版包或手工 echo 1 > cpuidle state disable。
R /etc/systemd/system/meizu-wfi.service
