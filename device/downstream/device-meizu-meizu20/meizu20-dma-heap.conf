# Meizu 20 (m2381) modules-load.d: dma-buf heaps boot load (r75, 2026-11-22).
# libcamera SimplePipeline SoftwareIsp needs a dma-buf allocator (/dev/dma_heap/
# system) — without it debayering is disabled and raw-only configs are rejected
# by QtMultimedia ("The configuration is not valid", 11-22 plasma-camera probe).
# CONFIG_DMABUF_HEAPS_{SYSTEM,CMA}=m since r104-era, but misc devices have no
# open-time autoload (same class as the r59 uinput lesson) => boot-time load.
system_heap
cma_heap
