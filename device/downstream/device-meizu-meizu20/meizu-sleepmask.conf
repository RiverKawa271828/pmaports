# Meizu 20: suspend is deadly on this port (deep sleep never worked;
# even s2idle dies - AGENTS/suspend 现状). Keep the sleep targets masked
# on every image/install. Plain L = an existing /etc symlink or admin
# override wins; to experiment, unmask by hand and it sticks.
L /etc/systemd/system/sleep.target - - - - /dev/null
L /etc/systemd/system/suspend.target - - - - /dev/null
L /etc/systemd/system/hibernate.target - - - - /dev/null
