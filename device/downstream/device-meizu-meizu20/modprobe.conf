# Meizu 20 (m2381): 活安全律黑名单（r69 起仅存 i2c/haptics 两件）
#
# r69（2026-11-20 开机顺序官方化，参照一加6/FP5-6/Alpine 三源时序 ground truth）：
#   摘 qcom_q6v5_pas/qcom_q6v5_mss blacklist —— PAS 内核态自动 probe
#   （ADSP/CDSP/mpss 比一切 systemd 服务早），meizu-pas.service 同轮退役。
#   boot 期服务接力解封 = 竞态温床：keeper 解封段按 remoteproc class 节点
#   存在性门控，pas 未先绑定 4080000 则整段静默跳过（11-20 boot 活体复现：
#   modem 缺席 + rmtfs -s rprocfd 崩环 1225 次）。官方形态兜底 = rmtfs unit
#   自带 -s（rprocfd 联动，modem 晚到只崩环等它）+ Restart=always RestartSec=1。
#   9-28 旧签名（echo start mpss = 秒级硬复位）= 旧 UEFI 链时代产物；11-19
#   蜂窝复燃轮起 mpss 解封多轮全绿，非当前链属性。
#
# ★ pmOS ~20s 硬复位真元凶(2026-09-28 穷举走查 /bisect.cur 钉死):
#   udev 冷插拔加载 i2c_qcom_geni(绑 Geni I2C 适配器)= 秒级硬复位,
#   与 XBL 门闩家族同签名。
#   【2026-09-29 更新】新 UEFI 链上定向绑定已安全: i2c_qcom_geni 仍保持
#   禁载(防 udev 冷插拔全绑 —— 880000.i2c 在新链仍致死),由
#   meizu-touch.service 以 autoprobe=0 + 定向绑 a90000(触摸)/98c000
#   (hub_3 相机路径, r69)方式手动加载。880000 永不绑 = 活安全律非历史
#   包袱勿摘（触控轮 experiment-log「2026-09-29」+ 主档 i2c 速查）。
blacklist i2c_qcom_geni
blacklist qcom_hv_haptics
