# Meizu 20 (m2381): PAS/remoteproc 全家禁载 (2026-09-28)
#
# 实测(崩溃标记 /bisect.cur 钉死): echo start > remoteproc*/state (mpss)
# = 秒级硬复位,无 panic、ramoops 不留痕 —— 与 XBL 门闩家族同签名
# (WDT 0x17c10000 / TLMM 同族,见 AGENTS.md 硬定律 #4/#10)。
# udev 冷插拔 + ModemManager 自动 start 是 pmOS 根fs ~20s 硬复位死亡的
# 定时器(模块在位时不 start 则一直活着)。
# adsp/cdsp 在现有固件集下 PAS init 本来就 -22 失败(TZ 拒),禁载零损失。
# 解禁条件: PAS/TZ 链专项调查后。
blacklist qcom_q6v5_pas
blacklist qcom_q6v5_mss
#
# ★ pmOS ~20s 硬复位真元凶(2026-09-28 穷举走查 /bisect.cur 钉死):
#   udev 冷插拔加载 i2c_qcom_geni(绑 Geni I2C 适配器)= 秒级硬复位,
#   与 XBL 门闩家族同签名。它是本设备 DT+模块集交集下唯二可冷插拔模块
#   之一(qcom_rng 已单测无罪)。
#   【2026-09-29 更新】新 UEFI 链上定向绑定已安全: i2c_qcom_geni 仍保持
#   禁载(防 udev 冷插拔全绑 —— 880000.i2c 在新链仍致死),由
#   meizu-touch.service 以 autoprobe=0 + 只绑 a90000(触摸)方式手动加载。
#   触摸在新链已通(GPI -110 消失),详见 experiment-log「2026-09-29 触控轮」。
blacklist i2c_qcom_geni
blacklist qcom_hv_haptics
