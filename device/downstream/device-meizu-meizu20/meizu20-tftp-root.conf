# Meizu 20 (m2381) tmpfiles: modem TFTP 固件根持久化。
# r69 (2026-11-20) = GNSS 取证轮（一百零七）TFTP 根结构性坑收尾：手工重建的
# 根不在任何包内，rootfs 侧操作后即失（modem mcfg TFTP 请求挂 = boot 阻塞级坑）。
# 正确形态 = tqftpserv 根 /readonly/firmware：image → 固件 apk 的 modem mcfg
# 目录（firmware-meizu-meizu20 提供），readwrite 目录供 modem 写侧。
d /readonly 0755 root root
d /readonly/firmware 0755 root root
L+ /readonly/firmware/image - - - - /lib/firmware/qcom/sm8550/meizu
d /readonly/firmware/readwrite 0755 root root
