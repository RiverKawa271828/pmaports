# Meizu 20 (m2381): resolved FallbackDNS 折中补偿（r82，2026-11-26）。
# 背景：P3 标准化后（数据面 = NM 标准形态），NM 收到 carrier DNS（bearer 侧实录
# 移动 211.139.5.27/28）但不推 systemd-resolved——qmapmux0.0 被 NM 注册为
# Generic device，DNS push 环节 NM 侧断（已知小缺口，复燃 = NM upstream 查
# Generic device push 路径）。断 WiFi 时 resolved 无任何口上 DNS → 落 FallbackDNS；
# systemd 上游默认 = quad9（中国可达性一般）。本件把兜底换成：移动 carrier DNS
# + AliDNS 公共 anycast（carrier 中立、中国可达）。FallbackDNS 仅在所有口都无
# DNS 时启用（WiFi 在 = 沉默），不影响日常解析路径。换卡后可按 bearer 实报调整
# （mmcli -b 1 详情 / /var/log/cell-keeper.log 的 mm-dial PASS dns= 行）。
[Resolve]
FallbackDNS=211.139.5.27 211.139.5.28 223.5.5.5
