# Meizu 20 (m2381) — s2idle 长睡会误触 systemd 服务看门狗（会话关键服务，看门狗关闭）。
#
# 根因链（2026-10-09，内核 #78，全部实证）：
#  ① 内核侧：kernel/power/suspend.c 的 suspend_enter() 对 PM_SUSPEND_TO_IDLE 直接
#     `s2idle_loop(); goto Platform_wake;` —— **跳过 syscore_suspend()**，因此
#     timekeeping_suspend() 不运行 ⇒ **s2idle 睡着期间 CLOCK_MONOTONIC 照常走**
#     （实测：睡 223.9s，monotonic 也 +223.9s；这是内核 s2idle 语义，非缺陷）。
#  ② systemd 侧：服务看门狗（systemd-udevd/logind/journald/coredumpd 上游均为
#     WatchdogSec=3min，monotonic 计时）在唤醒瞬间发现「超过 3 分钟没喂狗」⇒
#     SIGABRT + 重启（journal：Watchdog timeout (limit 3min)!）。实测 210s 睡 →
#     udevd+logind 同时被杀；97s 睡 → coredumpd 被杀；113s 睡 → 无事。
#  ③ 用户面：logind 重启丢会话设备接管状态 ⇒ kwin 再也拿不到输入/DRM 设备
#     （journal：`Failed to open /dev/input/eventN (Device already taken)` +
#     `Could not find edid for connector DSI-1`）⇒ **屏黑 + 电源键/触控全无反应，
#     拔插 USB 只有提示音**（= 内核活着）。即用户报的「睡后醒不来」。
#
# 处置：udevd/logind = 会话关键（被杀 = 设备接管与本地输入全废）⇒ WatchdogSec=0；
# 其余 systemd 内部服务用 10-meizu-watchdog-relax.conf 放宽到 30min（保留兜底，
# 且它们被杀本就不破坏会话）。挂起/恢复语义不受影响。
[Service]
WatchdogSec=0
