# Meizu 20 (m2381) tmpfiles: ADSP 传感器 PD 的 temp.json 可写路径。
# r69 (2026-11-20) 还债：hexagonrpcd 传感器 PD 每次初始化重建 temp.json
# （thermal 注册表运行态），字面路径 /mnt/vendor/persist/sensors/... 在 pmOS
# 不存在（persist 分区未挂载，deviceinfo 零 fstab）⇒ 每次写开失败刷 journal
# ~980 行/boot（109 候补「temp.json 刷屏」根治）。pmOS rootfs 可写 —— 就地补齐
# 目录 + 空文件，PD 重建即成功；读侧注册表仍在 meizu-sensors-root.tgz 的 -R
# 根（sensors/config JSONs），行为面零变化。若未来真挂 persist 分区，此目录
# 被遮蔽 = 自动让位。
d /mnt/vendor/persist/sensors/registry/registry 0755 root root
f /mnt/vendor/persist/sensors/registry/temp.json 0644 root root
