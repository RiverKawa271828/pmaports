# Meizu 20 (m2381) tmpfiles: ADSP 传感器 PD 的 temp.json 可写路径（r83 根治版）。
# r69 (2026-11-20) 版针对字面 /mnt/vendor/persist 路径 —— 后取证（2026-11-26
# 一百二十四轮）实锤：hexagonrpcd 在 apps_std 层无条件拒一切写开
# （AEE_EUNSUPPORTED，apps_std_fopen_with_env 先拒再解析路径），任何文件系统
# 形态都够不着 ⇒ r69 路径从未被用到（journal "Tried to open ... for writing"
# ~980 行/boot 的真因；TD-10「白名单/alias 层另有乾坤」兑现）。
# r83 = hexagonrpcd 0006 补丁（写开仅放行映射到 temp.json 的 dirent + FWRITE
# method 5）落地后，PD 的真实请求路径 = 虚拟树 /mnt/vendor/persist/sensors/
# registry/registry/../temp.json，物理目标 = sensorspd 的 -R 根
# /usr/share/qcom/sm8550/Meizu/m2381/mnt/vendor/persist/sensors/registry/
# temp.json。hexagonrpcd 以 fastrpc 用户跑 sensorspd 会话 ⇒ 文件须 fastrpc
# 可写。rootfs 持久 = 传感器框架重建的热注册表运行态跨 boot 保留（stock
# persist 语义近似；重刷 rootfs 后由框架自重建，无损）。
d /usr/share/qcom/sm8550/Meizu/m2381/mnt/vendor/persist/sensors/registry 0755 root root
f /usr/share/qcom/sm8550/Meizu/m2381/mnt/vendor/persist/sensors/registry/temp.json 0664 fastrpc fastrpc
